{% extends 'base.html' %}

{% block title %}Login - BOUESTI Student Complaint System{% endblock %}

{% block content %}
<div
    style="max-width: 400px; margin: 2rem auto; padding: 2rem; background-color: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--primary-color);">System Login</h2>

    <form action="{{ url_for('login') }}" method="POST">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Username / Matric No</label>
            <input type="text" name="username" required
                style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-color); color: var(--text-color);">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
            <input type="password" name="password" required
                style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-color); color: var(--text-color);">
        </div>

        <button type="submit"
            style="width: 100%; padding: 0.75rem; background-color: var(--primary-color); color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            Sign In
        </button>
    </form>

    <p style="text-align: center; margin-top: 1rem; color: var(--text-muted); font-size: 0.9rem;">
        Don't have an account? <a href="{{ url_for('register') }}"
            style="color: var(--primary-color); text-decoration: none; font-weight: bold;">Register here</a>
    </p>
</div>
{% endblock %}
