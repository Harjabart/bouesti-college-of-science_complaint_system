{% extends "base.html" %}
{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card shadow border-0 p-4">
        <h3 class="fw-bold mb-3">Reset Password</h3>
        <p class="text-muted">Enter your registered email address and we will send you a password reset link.</p>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="student@bouesti.edu.ng" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">Send Reset Link</button>
        </form>
    </div>
</div>
{% endblock %}
