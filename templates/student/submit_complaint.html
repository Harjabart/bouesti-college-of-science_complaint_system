{% extends "base.html" %}

{% block title %}Submit New Complaint - BOUESTI Complaint Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-paper-plane me-2"></i>Submit a New Complaint</h5>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('submit_complaint') }}" method="POST" enctype="multipart/form-data">

                        <!-- Category Selection -->
                        <div class="mb-3">
                            <label for="category_id" class="form-label fw-bold">Complaint Category <span
                                    class="text-danger">*</span></label>
                            <select name="category_id" id="category_id" class="form-select" required>
                                <option value="" selected disabled>Select Category...</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Priority Selection -->
                        <div class="mb-3">
                            <label for="priority" class="form-label fw-bold">Priority Level</label>
                            <select name="priority" id="priority" class="form-select">
                                <option value="Low">Low</option>
                                <option value="Normal" selected>Normal</option>
                                <option value="High">High</option>
                                <option value="Urgent">Urgent</option>
                            </select>
                        </div>

                        <!-- Subject -->
                        <div class="mb-3">
                            <label for="subject" class="form-label fw-bold">Subject / Title <span
                                    class="text-danger">*</span></label>
                            <input type="text" name="subject" id="subject" class="form-control"
                                placeholder="Brief summary of your complaint" required>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">Detailed Description <span
                                    class="text-danger">*</span></label>
                            <textarea name="description" id="description" class="form-control" rows="5"
                                placeholder="Provide full details regarding the issue..." required></textarea>
                        </div>

                        <!-- File Upload -->
                        <div class="mb-4">
                            <label for="file" class="form-label fw-bold">Attachment (Optional)</label>
                            <input type="file" name="file" id="file" class="form-control"
                                accept=".png,.jpg,.jpeg,.pdf,.doc,.docx">
                            <div class="form-text">Allowed files: PNG, JPG, JPEG, PDF, DOC, DOCX (Max 16MB)</div>
                        </div>

                        <!-- Actions -->
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-paper-plane me-1"></i> Submit Complaint
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
