{% extends 'base.html' %}

{% block title %}Submit Complaint - BOUESTI College of Science{% endblock %}

{% block content %}
<div
    style="max-width: 650px; margin: 2rem auto; background: var(--card-bg, #1e1e1e); padding: 2rem; border-radius: 10px; border: 1px solid var(--border-color, rgba(255,255,255,0.1)); shadow: 0 4px 20px rgba(0,0,0,0.15);">
    <h2 style="color: var(--primary-color); margin-bottom: 0.5rem; font-weight: 800;">File a Complaint</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.8rem;">
        Fill out the details below. Once submitted, you will receive a unique tracking reference number.
    </p>

    <form action="{{ url_for('submit_complaint') }}" method="POST" enctype="multipart/form-data"
        style="display: flex; flex-direction: column; gap: 1.2rem;">

        <!-- Category Selection -->
        <div>
            <label
                style="display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: var(--text-color);">Complaint
                Category</label>
            <select name="category" required
                style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color, #444); background-color: var(--bg-color, #121212); color: var(--text-color); font-size: 0.95rem;">
                <option value="Academic">Academic (Grades, Exams, Results)</option>
                <option value="Administrative">Administrative (Registration, Clearance)</option>
                <option value="Facility/ICT">Facility / ICT Portal Issue</option>
                <option value="General" selected>General Grievance</option>
            </select>
        </div>

        <!-- Subject/Title -->
        <div>
            <label
                style="display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: var(--text-color);">Subject
                / Title</label>
            <input type="text" name="title" placeholder="e.g. Missing Result for CSC 301" required
                style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color, #444); background-color: var(--bg-color, #121212); color: var(--text-color); font-size: 0.95rem;">
        </div>

        <!-- Detailed Description -->
        <div>
            <label
                style="display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: var(--text-color);">Detailed
                Description</label>
            <textarea name="description" rows="5" placeholder="Provide full context, course codes, dates, or details..."
                required
                style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color, #444); background-color: var(--bg-color, #121212); color: var(--text-color); font-size: 0.95rem; resize: vertical;"></textarea>
        </div>

        <!-- Evidence Attachment Upload -->
        <div>
            <label
                style="display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: var(--text-color);">Attach
                Evidence (Optional)</label>
            <input type="file" name="attachment" accept=".pdf,.png,.jpg,.jpeg"
                style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px dashed var(--primary-color); background-color: rgba(224, 86, 36, 0.05); color: var(--text-color); font-size: 0.85rem;">
            <small style="color: var(--text-muted); display: block; margin-top: 0.3rem;">Accepted formats: PDF, PNG, JPG
                (Max: 5MB)</small>
        </div>

        <!-- Submit Action -->
        <button type="submit"
            style="background-color: var(--primary-color); color: #ffffff; padding: 0.85rem; border: none; border-radius: 6px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; transition: opacity 0.2s;">
            Submit Complaint
        </button>
    </form>
</div>
{% endblock %}
